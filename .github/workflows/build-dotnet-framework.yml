# Build reutilizável para projetos .NET Framework (Windows Forms, ASP.NET MVC/Web API 4.x).
# Roda em Windows: restaura os pacotes NuGet (packages.config) e compila a solução com MSBuild.
# Chamado pelo .github/workflows/build.yml do repositório; o job se chama "Build e testes"
# para casar com o check obrigatório "build / Build e testes" da regra protege-development.
name: Build .NET Framework

on:
  workflow_call:
    inputs:
      solucao:
        description: Caminho do arquivo .sln
        type: string
        required: true
      configuracao:
        description: Configuração do MSBuild
        type: string
        default: Release

permissions:
  contents: read

concurrency:
  group: build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build e testes
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restaurar pacotes
        run: nuget restore "${{ inputs.solucao }}"

      - name: Compilar
        run: msbuild "${{ inputs.solucao }}" /p:Configuration=${{ inputs.configuracao }} /m /verbosity:minimal
